services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FEE_ENVIRONMENT: development
    volumes:
      - ./src:/app/src:ro
    command:
      - uvicorn
      - fee_server.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --reload
      - --reload-dir
      - /app/src
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

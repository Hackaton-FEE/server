services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fee
      POSTGRES_PASSWORD: fee
      POSTGRES_DB: fee
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fee-db-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FEE_ENVIRONMENT: development
      FEE_DATABASE_URL: postgresql+psycopg://fee:fee@db:5432/fee
      FEE_JWT_SECRET: dev-insecure-secret-change-me-000000000000
    volumes:
      - ./src:/app/src:ro
    command:
      - uvicorn
      - fee_server.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --reload
      - --reload-dir
      - /app/src
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  fee-db-data:

name: Server CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Server checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fee_tests
          POSTGRES_USER: fee_test
          POSTGRES_PASSWORD: fixture-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fee_test -d fee_tests"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.12
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Test API and configuration
        env:
          FEE_TEST_POSTGRES_URL: postgresql+psycopg://fee_test:fixture-only-postgres-password@127.0.0.1:5432/fee_tests
        run: uv run --frozen pytest

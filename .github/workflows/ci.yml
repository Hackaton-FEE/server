name: Server CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Server checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.12
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Test API and configuration
        run: uv run --frozen pytest
